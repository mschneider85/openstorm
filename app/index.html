<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#eceef1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>OpenStorm</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">&gt; openstorm</div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="program" class="active">Programm</button>
        <button role="tab" data-tab="devices">Geräte</button>
      </nav>
      <div class="actions">
        <button id="project-btn" class="project-btn" title="Projekte"></button>
        <button id="connect-btn" class="conn" data-kind="none"><span class="dot"></span><span class="conn-label">Nicht verbunden</span></button>
      </div>
    </header>

    <main>
      <section id="tab-program" class="tab active">
        <div class="workspace-card">
          <div id="blockly"></div>
          <div class="run-bar">
            <button id="run-btn" class="run">▶ Start</button>
            <button id="stop-btn" class="stop" disabled>■ Stopp</button>
          </div>
        </div>
        <aside id="console" class="console">
          <div class="console-head">
            <button id="console-toggle" class="console-title" aria-label="Bereich ein- oder ausklappen"></button>
            <div class="console-views" role="tablist">
              <button role="tab" data-view="output" class="active">Ausgabe</button>
              <button role="tab" data-view="datalog">Messwerte</button>
            </div>
            <div class="spacer"></div>
            <button id="datalog-csv" class="btn ghost small" hidden>Als Tabelle speichern</button>
            <button id="console-clear" class="btn ghost small">Leeren</button>
          </div>
          <div id="console-lines" class="console-lines"></div>
          <div id="datalog" class="datalog" hidden></div>
        </aside>
      </section>
      <section id="tab-devices" class="tab"></section>
    </main>

    <dialog id="connect-dialog">
      <div class="dialog-head"><h2>Verbindung</h2><button class="dialog-close" aria-label="Schließen">✕</button></div>
      <div class="dialog-body"></div>
    </dialog>

    <dialog id="projects-dialog">
      <div class="dialog-head"><h2>Projekte</h2><button class="dialog-close" aria-label="Schließen">✕</button></div>
      <div class="dialog-body">
        <div class="segmented" role="tablist">
          <button role="tab" data-place="local" class="active">Auf diesem Gerät</button>
          <button role="tab" data-place="ev3">Auf dem EV3</button>
        </div>
        <section data-place="local">
          <div class="project-actions">
            <button id="project-new" class="btn primary">+ Neues Projekt</button>
            <button id="project-import" class="btn">Datei importieren …</button>
            <input id="project-import-file" type="file" accept=".json,application/json" hidden />
          </div>
          <div class="project-list local-list"></div>
        </section>
        <section data-place="ev3" hidden>
          <div class="ev3-note"></div>
          <div class="project-list ev3-list"></div>
          <p class="muted projects-hint">Auf dem EV3 laufen Programme ohne Verbindung: Datei-Navigation → Ordner → Programm.</p>
        </section>
        <p class="dialog-status" role="status" aria-live="polite"></p>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
