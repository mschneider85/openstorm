<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1f2a36" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>OpenStorm</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><img src="/logo.svg" alt="" />OpenStorm</div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="program" class="active">Programm</button>
        <button role="tab" data-tab="devices">Geräte</button>
      </nav>
      <button id="project-btn" class="project-btn" title="Projekte"></button>
      <div class="spacer"></div>
      <button id="connect-btn" class="conn" data-kind="none"><span class="dot"></span><span class="conn-label">Nicht verbunden</span></button>
      <button id="transfer-btn" class="transfer" title="Programm auf den EV3 übertragen, damit er es ohne iPad ausführt">⇩ Auf EV3</button>
      <button id="run-btn" class="run">▶ Start</button>
      <button id="stop-btn" class="stop" disabled>■ Stopp</button>
    </header>

    <main>
      <section id="tab-program" class="tab active">
        <div id="blockly"></div>
        <aside id="console" class="console">
          <div class="console-head">
            <button id="console-toggle" class="console-title">Ausgabe</button>
            <button id="console-clear" class="btn ghost small">Leeren</button>
          </div>
          <div id="console-lines" class="console-lines"></div>
        </aside>
      </section>
      <section id="tab-devices" class="tab"></section>
    </main>

    <dialog id="connect-dialog">
      <div class="dialog-head"><h2>Verbindung</h2><button class="dialog-close" aria-label="Schließen">✕</button></div>
      <div class="dialog-body"></div>
    </dialog>

    <dialog id="projects-dialog">
      <div class="dialog-head"><h2>Projekte</h2><button class="dialog-close" aria-label="Schließen">✕</button></div>
      <div class="dialog-body">
        <div class="project-actions">
          <button id="project-new" class="btn primary">Neues Projekt</button>
          <button id="project-export" class="btn">Aktuelles exportieren</button>
          <button id="project-import" class="btn">Importieren …</button>
          <input id="project-import-file" type="file" accept=".json,application/json" hidden />
        </div>
        <div class="project-list"></div>
        <section class="ev3-projects">
          <h3>Auf dem EV3</h3>
          <p class="muted">Mit „⇩ Auf EV3“ übertragene Programme lassen sich hier wieder öffnen.</p>
          <button id="ev3-list" class="btn">Programme auf dem EV3 anzeigen</button>
          <div class="project-list ev3-list"></div>
        </section>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
