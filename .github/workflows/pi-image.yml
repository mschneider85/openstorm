# Builds a ready-to-flash Raspberry Pi OS image (Pi Zero W) with the OpenStorm bridge.
# Download: https://github.com/<owner>/<repo>/releases/download/pi-image/openstorm-pi.img.xz
name: Raspberry-Pi-Image bauen

on:
  push:
    branches: [main]
    paths: ['bridge/**', 'app/**', '.github/workflows/pi-image.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Brücke testen
        working-directory: bridge
        run: |
          pip install aiohttp
          python -m unittest -v

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The Pi serves the app itself on http://openstorm.local/ (base path "/").
      - name: Web-App für den Pi bauen
        working-directory: app
        run: |
          npm ci
          npm run build
          cp -r dist ../bridge/www

      # Running bridges update themselves from this release ("Aktualisieren" in the app),
      # see Updater in bridge/openstorm_bridge.py.
      - name: Update-Paket veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(git log -1 --format=%cd --date=format:%Y-%m-%d)-$(git rev-parse --short HEAD)"
          echo "$VERSION" > bridge/VERSION
          tar -czf openstorm-update.tar.gz -C bridge openstorm_bridge.py VERSION www
          printf '{"version": "%s", "sha256": "%s"}\n' "$VERSION" \
            "$(sha256sum openstorm-update.tar.gz | cut -d' ' -f1)" > version.json
          cat version.json
          gh release view pi-update >/dev/null 2>&1 || gh release create pi-update \
            --title "Update für die Raspberry-Pi-Brücke" --latest=false \
            --notes "Wird von der Brücke selbst geladen (App → Verbindung → Aktualisieren)."
          gh release upload pi-update openstorm-update.tar.gz version.json --clobber

      - name: Image bauen
        id: build
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: raspios_lite:latest
          image_additional_mb: 512
          copy_repository_path: /opt/openstorm-src
          shell: /bin/bash
          commands: |
            sh bridge/install-pi.sh
            # Login for maintenance (keyboard/SSH): user "openstorm", password "openstorm".
            id openstorm >/dev/null 2>&1 || useradd -m -s /bin/bash -G sudo,adm openstorm
            echo openstorm:openstorm | chpasswd
            systemctl disable userconfig.service 2>/dev/null || true
            systemctl enable ssh

      - name: Image komprimieren
        run: |
          sudo mv "${{ steps.build.outputs.image }}" openstorm-pi.img
          sudo chown "$USER" openstorm-pi.img
          xz -T0 -6 openstorm-pi.img
          ls -lh openstorm-pi.img.xz

      # A fixed tag keeps the download link stable; "latest" stays reserved for the iPad app.
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pi-image --yes --cleanup-tag || true
          gh release create pi-image openstorm-pi.img.xz \
            --target "${{ github.sha }}" \
            --title "Raspberry-Pi-Image (Pi Zero W)" \
            --latest=false \
            --notes "OpenStorm-Brücke für den Raspberry Pi Zero W, Stand: $(git log -1 --format='%h %s')

          Mit dem Raspberry Pi Imager auf eine SD-Karte schreiben (\"Eigenes Image\"), siehe README."
