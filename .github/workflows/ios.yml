# Builds an unsigned iPad app (.ipa) on a macOS runner, so no Mac is needed.
# Sign and install it on the iPad with Sideloadly and a free Apple ID (see README).
name: iOS-App bauen

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write # for publishing the release

jobs:
  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Web-App bauen
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync ios

      - name: Xcode-Projekt bauen (unsigniert)
        run: |
          xcodebuild -list -project ios/App/App.xcodeproj
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: IPA packen
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry OpenStorm.ipa Payload

      # Every build becomes the latest release, so the app can be downloaded without
      # a GitHub login: https://github.com/<owner>/<repo>/releases/latest/download/OpenStorm.ipa
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" OpenStorm.ipa \
            --target "${{ github.sha }}" \
            --title "OpenStorm Build ${{ github.run_number }}" \
            --notes "$(git log -1 --format=%s)

          Installation: OpenStorm.ipa herunterladen und mit Sideloadly aufs iPad übertragen (siehe README)." \
            --latest
