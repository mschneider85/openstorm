# Publishes the landing page (site/) to GitHub Pages: https://<owner>.github.io/<repo>/
# The web app goes below it, at app/: for the simulator, PCs (Web Serial) and Bluefy.
# On the iPad the app comes from the Raspberry Pi bridge.
name: Publish landing page

on:
  push:
    branches: [main]
    paths: ['site/**', 'app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build -- --base=/${{ github.event.repository.name }}/app/
      - name: Put the landing page and the app together
        run: |
          cp -r ../site ../_site
          cp -r dist ../_site/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
